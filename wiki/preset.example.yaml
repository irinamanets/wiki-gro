# Wiki Preset Manifest — EXAMPLE / DOCUMENTATION
#
# This file is NOT active on the template branch. It exists to document
# the preset.yaml schema for humans and for the /preset-init slash command,
# which uses it as a reference when generating a real preset.yaml for
# a new instance.
#
# When you create a new instance branch from template, run /preset-init —
# the orchestrator will interactively collect parameters and generate
# wiki/preset.yaml (not .example.yaml) with your answers. This example
# stays in place as schema documentation.

preset:
  # Human-readable name of this instance.
  # Examples: "gro-marketplaces", "karina-digital-twin", "b2b-content-kb"
  name: example-instance

  # Short unique prefix used in page IDs as "<namespace>:<layer>/<theme>/<slug>".
  # Must be lowercase a-z + digits, 4–10 chars. Used by the future merge
  # workflow to avoid collisions between multiple wikis.
  namespace: example

  # Schema version. Bump when preset.yaml structure evolves.
  version: 1

  # 1–3 sentences describing what this wiki is for. Shown by orchestrator
  # in summaries.
  description: >
    Example preset showing the full schema. Replace with a real
    description of your domain when instantiating.

# Which of the 6 universal layers this instance actually uses.
# Only listed layers have physical directories created. Disabled layers
# cannot hold pages.
#
# Selection guide by use case:
#   - personal / digital twin → canon, evolving, volatile (no strict variants)
#   - marketing / content    → canon, canon-strict, evolving, evolving-strict, volatile-strict
#   - industry / coach       → canon, canon-strict, evolving, evolving-strict
#   - regulatory / compliance → all 6
enabled_layers:
  - canon             # stable (years), loose citation — concepts, methodologies, identity
  - canon-strict      # stable (years), strict citation — canonical facts with audit trail
  - evolving          # medium (months), loose — trends, positioning, evolving frameworks
  - evolving-strict   # medium (months), strict — metrics, rules that drift, per-quarter data
  - volatile          # short (days–weeks), loose — current digests, news summaries
  - volatile-strict   # short (days–weeks), strict — breaking news with required source

# Thematic subdirectories inside each layer. A page at
# wiki/<layer>/<theme>/<slug>.md is valid only if <theme> ∈ themes[<layer>].
# wiki-lint flags violations.
#
# Themes ARE domain-specific. Choose them to match your content categories.
themes:
  canon:
    - concepts          # foundational frameworks and ideas
    - methodologies     # ways of working, approaches, processes
    - entities          # people, orgs, products relevant to the domain
  canon-strict:
    - regulations       # laws, standards, compliance requirements
    - historical-cases  # completed case studies with full audit trail
  evolving:
    - trends            # directional observations about the market/field
    - positioning       # strategic angles, differentiation
  evolving-strict:
    - platform-rules    # rates, fees, terms that change quarterly
    - metrics           # benchmarks, ratios, norms with source dates
  volatile:
    - weekly-digest     # rolling weekly summaries
  volatile-strict:
    - breaking-news     # time-sensitive news items with source links

# Light tag taxonomy. Pages may use these or invent their own, but
# REFLECT will suggest canonicalizing repeated ad-hoc tags.
# Tags are grouped by dimension for clarity but are flat at the page level.
tags:
  domain-1:
    - example-tag-a
    - example-tag-b
    - example-tag-c
  domain-2:
    - example-tag-d
    - example-tag-e

# Optional closed enum for the front-matter `subtype:` field.
# Leave empty to allow any subtype.
page_types:
  - concept
  - entity
  - metric
  - case
  - rule
  - methodology

# Identity block — used by personal KBs / digital twins.
# For non-personal wikis, leave owner: null and omit the rest.
identity:
  owner: null
  # For digital twin instances:
  # primary_roles: [founder, parent, teacher, ...]
  # core_topics: [psychology, business, tech, ...]
  # signature_methods: [reframing, analogies, trend-watching, ...]
